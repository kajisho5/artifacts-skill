name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[all,dev]"

      # LibreOffice backs PPTX/DOCX/XLSX render() (see docs/adapters.md); without
      # it those render-happy-path tests self-skip via each adapter's own
      # soffice-actually-works probe instead of running for real.
      - name: Install LibreOffice (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-impress libreoffice-writer libreoffice-calc
      - name: Install LibreOffice (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask libreoffice

      - name: Install Chromium for Playwright (Linux)
        if: runner.os == 'Linux'
        run: playwright install --with-deps chromium
      - name: Install Chromium for Playwright (macOS)
        if: runner.os == 'macOS'
        run: playwright install chromium

      - run: ruff check .
      - run: mypy
      - run: python -m pytest tests/ -q
      - run: artifacts-skill doctor --json
      - run: artifacts-skill contract --json
      - run: python3 tests/benchmark/run_benchmark.py
      - run: python3 examples/standalone_contract_consumer.py tests/fixtures/pdf/good_2page.pdf

  # Verifies the actual distributable artifacts install and run cleanly, not
  # just the source tree under pytest (Issue #13) - this was previously only
  # ever checked manually, once, during a review pass.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: pip install build
      - run: python -m build

      - name: Install the wheel into a fresh venv and smoke-test it
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/python -c "import artifact_skill; print(artifact_skill.__file__)"
          /tmp/wheel-venv/bin/artifacts-skill --version
          /tmp/wheel-venv/bin/artifacts-skill doctor --json

      - name: Verify the npm package contents against package.json's files list
        run: |
          test -x bin/artifacts-skill.js
          npm pack --dry-run --json > /tmp/npm-pack.json
          python3 - <<'EOF'
          import json

          with open("package.json") as f:
              declared = json.load(f)["files"]
          with open("/tmp/npm-pack.json") as f:
              data = json.load(f)
          packed_paths = [e["path"] for e in data[0]["files"]]

          # Every *inclusion* entry in package.json's `files` list must have
          # actually landed in the tarball - a directory entry (e.g.
          # "schemas", "src/artifact_skill") is satisfied by any packed path
          # under that prefix, a file entry by an exact match. This checks
          # the declaration and the real tarball agree, not a fixed subset
          # hand-picked when this CI step was first written (that subset
          # silently stopped covering `schemas/` once it was added to
          # `files` without updating this check).
          inclusions = [e for e in declared if not e.startswith("!")]
          for entry in inclusions:
              matches = [p for p in packed_paths if p == entry or p.startswith(entry + "/")]
              assert matches, f"'{entry}' (from package.json's files list) has nothing packed under it: {sorted(packed_paths)}"

          # Self-audit finding: npm's `files` field ignores .gitignore/
          # .npmignore entirely once it's declared at all - a real `npm
          # pack` run leaked every stale Python __pycache__/*.pyc under
          # src/artifact_skill/ (present after any local pytest/module run,
          # a completely ordinary state for whoever's machine runs `npm
          # publish`) straight into the published tarball before the
          # negation entries below were added. Assert the exclusion
          # actually holds, not just that the negation patterns are present
          # in package.json - a typo'd pattern would silently do nothing.
          leaked = [p for p in packed_paths if "__pycache__" in p or p.endswith(".pyc")]
          assert not leaked, f"stale Python bytecode leaked into the npm package: {leaked}"

          assert "bin/artifacts-skill.js" in packed_paths, "bin/artifacts-skill.js missing from npm package"
          EOF

      - name: Install the npm package for real and run the CLI through it
        run: |
          # Everything above only checks the tarball's *contents* (npm pack
          # --dry-run) - it never actually installs the package or executes
          # bin/artifacts-skill.js, so a broken PYTHONPATH fallback (the
          # path a real `npx artifacts-skill` hits before any `pip install`
          # has ever run) could ship silently. Nothing on this runner has
          # put a pip-installed "artifacts-skill" console script on PATH
          # (the wheel install above is confined to /tmp/wheel-venv, never
          # added to PATH), so this exercises the real fallback path, not
          # the already-pip-installed shortcut.
          npm pack
          tarball=$(ls artifacts-skill-*.tgz)
          mkdir -p /tmp/npm-install-test
          cd /tmp/npm-install-test
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$tarball"
          ! command -v artifacts-skill  # sanity: nothing else on PATH could make this pass by accident
          node_modules/.bin/artifacts-skill --version
          node_modules/.bin/artifacts-skill doctor --json > /dev/null
