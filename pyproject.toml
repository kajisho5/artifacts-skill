[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artifact-skill"
version = "0.1.0"
description = "Local-first execution and verification engine for AI-generated artifacts (inspect -> plan -> execute -> render -> structural verify -> visual verify -> fix -> receipt)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "SEVENTHWELLD" }]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5.0", "pypdfium2>=4.30", "Pillow>=10.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "reportlab>=4.0"]

[project.scripts]
artifact-skill = "artifact_skill.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/artifact_skill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
