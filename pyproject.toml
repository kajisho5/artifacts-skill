[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artifact-skill"
version = "0.1.0"
description = "Local-first execution and verification engine for AI-generated artifacts (inspect -> plan -> execute -> render -> structural verify -> visual verify -> fix -> receipt)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "SEVENTHWELL" }]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5.0", "pypdfium2>=4.30", "Pillow>=10.0"]
pptx = ["python-pptx>=1.0", "pypdf>=5.0", "pypdfium2>=4.30", "Pillow>=10.0"]
docx = ["python-docx>=1.0", "pypdf>=5.0", "pypdfium2>=4.30", "Pillow>=10.0"]
xlsx = ["openpyxl>=3.1", "pypdf>=5.0", "pypdfium2>=4.30", "Pillow>=10.0"]
image = ["Pillow>=10.0"]
html = ["playwright>=1.40"]
svg = ["playwright>=1.40"]
all = [
    "pypdf>=5.0", "pypdfium2>=4.30", "Pillow>=10.0",
    "python-pptx>=1.0", "python-docx>=1.0", "openpyxl>=3.1",
    "playwright>=1.40",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "reportlab>=4.0", "python-pptx>=1.0", "python-docx>=1.0", "openpyxl>=3.1", "playwright>=1.40", "ruff>=0.16", "mypy>=1.13"]

[project.scripts]
artifact-skill = "artifact_skill.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/artifact_skill"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 145

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "BLE", "PIE", "PERF", "C4", "RUF"]
# ISC001/ISC004: this project's style deliberately implicit-concatenates long
# strings inside list literals (limitations()/docstrings); the extra parens
# the rule wants add noise without preventing any real bug.
ignore = ["ISC001", "ISC004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S110", "S603", "S607"]

[tool.mypy]
python_version = "3.10"
files = ["src/artifact_skill"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
